name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.6
        env: { POSTGRES_USER: parcours_owner, POSTGRES_PASSWORD: parcours_local, POSTGRES_DB: parcours }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U parcours_owner" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://parcours_owner:parcours_local@localhost:5433/parcours
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_EMAIL: admin@parcours.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cp .env.example .env.local
      # Stockage S3 local (SeaweedFS) pour les tests qui envoient des fichiers : même service que docker-compose.
      - run: docker compose up -d storage
      # SeaweedFS ouvre le port avant que son API S3 réponde : on réessaie l'init jusqu'à ce qu'elle passe.
      - name: Préparer le stockage
        run: |
          for i in $(seq 1 40); do
            npm run storage:init && exit 0
            echo "Stockage pas encore prêt (tentative $i)…" ; sleep 2
          done
          echo "Stockage S3 indisponible après attente." >&2 ; exit 1
      - run: node --import tsx scripts/migrate.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
